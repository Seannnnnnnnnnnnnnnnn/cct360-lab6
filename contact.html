<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Eats Club | Contact</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar md:navbar-expand bg-1 fg-2">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Campus Eats Club</a>
      <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
        <div class="drawer-header">
          <div class="drawer-title" id="navbarNavLabel">Menu</div>
          <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>
        <div class="drawer-body">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Events</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html" aria-current="page">Contact</a></li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>
  <main class="container">
    <h1>Contact Us</h1>
    <form class="row g-3">
      <div class="md:col-6 form-field">
        <label for="firstName" class="form-label">First name</label>
        <input type="text" class="form-control" id="firstName">
      </div>
      <div class="md:col-6 form-field">
        <label for="lastName" class="form-label">Last name</label>
        <input type="text" class="form-control" id="lastName">
      </div>
      <div class="md:col-6 form-field">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com">
      </div>
      <div class="md:col-6 form-field">
        <label for="topic" class="form-label">Topic</label>
        <select class="form-control" id="topic">
          <option selected>Choose one</option>
          <option value="join">Joining the club</option>
          <option value="events">Event questions</option>
          <option value="sponsor">Sponsorship</option>
        </select>
      </div>
      <div class="col-12 form-field">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="4"></textarea>
      </div>
      <div class="col-12 form-field">
        <input type="checkbox" id="consent" class="check">
        <label for="consent">I agree to be contacted by the club</label>
      </div>
      <div class="col-12">
        <button type="submit" class="btn-solid theme-primary">Submit</button>
      </div>
    </form>
  </main>
  <footer class="container">
    <p>&copy; 2026 Campus Eats Club</p>
  </footer>
  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
